name: Propose Release PR
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Publish approved release]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  statuses: write
concurrency:
  group: release-proposal
  cancel-in-progress: false
jobs:
  propose:
    if: >-
      github.event.repository.default_branch == 'main' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: aardex/AardexActions/release-management@REVIEWED_MERGED_SHA
        with:
          command: propose
