name: terraform-deploy
description: Deploy Terraform to Azure

inputs:
  execution-mode:
    required: false
    default: 'legacy'
    description: "legacy, reviewed-plan or reviewed-apply"
  azure-credentials:
    required: true
    description: "Azure credentials for authentication"
  azure-subscription:
    required: false
    description: "Azure subscription to deploy to (defaults to first subscription in credentials)"
  directory:
    required: false
    default: 'terraform'
    description: Terraform directory to deploy
  apply:
    required: false
    default: 'false'
    description: "Whether to run terraform apply"
  needs-approval:
    required: false
    default: 'true'
    description: "Whether to require approval for terraform apply"
  tfvars-content:
    required: false
    description: "Content of the terraform.tfvars file (as a single string, from secrets or workflow input)"
  plan-args:
    required: false
    default: ''
    description: "Additional arguments to pass to terraform plan (e.g., '-refresh=true -replace=xxx')"
  plan-summary-mode:
    required: false
    default: 'counts-only'
    description: "Plan summary: counts-only or human-readable (may expose sensitive data)"
  apply-summary-mode:
    required: false
    default: 'counts-only'
    description: "Apply summary: counts-only or human-readable (may expose sensitive data)"
  plan-storage:
    required: false
    default: 'none'
    description: "none or azure-blob; azure-blob requires apply=false"
  plan-storage-account:
    required: false
    description: "Private Azure Storage account for saved plans"
  plan-storage-container:
    required: false
    default: 'tfplans'
    description: "Private plan container"
  plan-events-container:
    required: false
    default: 'tfplan-events'
    description: "Private claim and result container"
  plan-environment:
    required: false
    description: "Target environment name bound to the plan"
  plan-id:
    required: false
    description: "Identifier from the reviewed plan"
  github-token:
    required: true
    description: "GitHub token for private module access"

outputs:
  plan-id:
    description: "Identifier of the uploaded plan, when secure storage is enabled"
    value: ${{ steps.store.outputs.plan-id }}
  plan-sha256:
    description: "SHA-256 of the reviewed and uploaded plan"
    value: ${{ steps.store.outputs.sha256 }}
  plan-commit:
    description: "Commit used to create the reviewed plan"
    value: ${{ steps.plan_context.outputs.commit }}
  plan-workspace:
    description: "Terraform workspace used for the reviewed plan"
    value: ${{ steps.plan_context.outputs.workspace }}
  plan-root:
    description: "Terraform root used for the reviewed plan"
    value: ${{ steps.plan_context.outputs.root }}

runs:
  using: composite
  steps:
    - name: Validate execution mode
      shell: bash
      env:
        EXECUTION_MODE: ${{ inputs.execution-mode }}
        STORAGE_MODE: ${{ inputs.plan-storage }}
        APPLY_INPUT: ${{ inputs.apply }}
        SUMMARY_MODE: ${{ inputs.plan-summary-mode }}
        STORAGE_ACCOUNT: ${{ inputs.plan-storage-account }}
        PLAN_CONTAINER: ${{ inputs.plan-storage-container }}
        EVENT_CONTAINER: ${{ inputs.plan-events-container }}
        PLAN_ENVIRONMENT: ${{ inputs.plan-environment }}
        PLAN_ID: ${{ inputs.plan-id }}
      run: |
        case "$STORAGE_MODE" in
          none|azure-blob) ;;
          *) echo 'Unsupported plan storage mode.' >&2; exit 1 ;;
        esac
        case "$EXECUTION_MODE" in
          legacy)
            if [[ "$STORAGE_MODE" == azure-blob && "$APPLY_INPUT" == true ]]; then
              echo 'Secure storage requires apply=false; use reviewed-apply.' >&2; exit 1
            fi ;;
          reviewed-plan)
            [[ "$APPLY_INPUT" == false && "$STORAGE_MODE" == azure-blob && "$SUMMARY_MODE" == human-readable ]] || {
              echo 'reviewed-plan requires apply=false, azure-blob storage and a human-readable summary.' >&2; exit 1;
            }
            [[ -n "$STORAGE_ACCOUNT" && -n "$PLAN_CONTAINER" && -n "$EVENT_CONTAINER" && -n "$PLAN_ENVIRONMENT" ]] || {
              echo 'Reviewed modes require a storage account and plan environment.' >&2; exit 1;
            } ;;
          reviewed-apply)
            [[ "$APPLY_INPUT" == false ]] || { echo 'reviewed-apply requires apply=false.' >&2; exit 1; }
            [[ -n "$STORAGE_ACCOUNT" && -n "$PLAN_CONTAINER" && -n "$EVENT_CONTAINER" && -n "$PLAN_ENVIRONMENT" && -n "$PLAN_ID" ]] || {
              echo 'reviewed-apply requires storage, environment and a plan ID.' >&2; exit 1;
            } ;;
          *) echo 'Unsupported execution mode.' >&2; exit 1 ;;
        esac

    - name: Login to Azure
      if: ${{ inputs.execution-mode != 'reviewed-apply' }}
      shell: bash
      run: |
        CLIENT_ID=$(echo '${{ inputs.azure-credentials }}' | jq -r .clientId)
        CLIENT_SECRET=$(echo '${{ inputs.azure-credentials }}' | jq -r .clientSecret)
        if [ -n "${{ inputs.azure-subscription }}" ]; then
          SUBSCRIPTION_ID=${{ inputs.azure-subscription }}
        else
          SUBSCRIPTION_ID=$(echo '${{ inputs.azure-credentials }}' | jq -r .subscriptionId)
        fi
        TENANT_ID=$(echo '${{ inputs.azure-credentials }}' | jq -r .tenantId)
        az login --service-principal -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID"
        az account set --subscription "$SUBSCRIPTION_ID"

    - name: Setup Terraform
      if: ${{ inputs.execution-mode != 'reviewed-apply' }}
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.13.3
        terraform_wrapper: false

    - name: Configure Git credential URL
      if: ${{ inputs.execution-mode != 'reviewed-apply' }}
      shell: bash
      env:
        PRIVATE_MODULES_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -z "$PRIVATE_MODULES_GITHUB_TOKEN" ]; then
          echo "github-token input is required for private Terraform module access."
          exit 1
        fi

        echo "::add-mask::$PRIVATE_MODULES_GITHUB_TOKEN"
        {
          echo "PRIVATE_MODULES_GITHUB_TOKEN=$PRIVATE_MODULES_GITHUB_TOKEN"
          echo "GIT_TERMINAL_PROMPT=0"
        } >> "$GITHUB_ENV"

        git config --global credential.https://github.com.username x-access-token
        git config --global credential.https://github.com.helper '!f() { test "$1" = get && echo username=x-access-token && echo "password=$PRIVATE_MODULES_GITHUB_TOKEN"; }; f'
        git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
        git config --global --add url."https://github.com/".insteadOf "git@github.com:"

    - name: Create terraform.tfvars from input
      if: ${{ inputs.execution-mode != 'reviewed-apply' && inputs.tfvars-content && inputs.tfvars-content != '' }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        TFVARS_CONTENT: ${{ inputs.tfvars-content }}
      run: |
        echo "📝 Creating terraform.tfvars from input"
        while IFS= read -r line; do
          echo "::add-mask::$line"
        done <<< "$TFVARS_CONTENT"
        printf '%s\n' "$TFVARS_CONTENT" > terraform.tfvars
        echo "✅ terraform.tfvars created successfully"

    - name: Terraform Init
      if: ${{ inputs.execution-mode != 'reviewed-apply' }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: bash "${{ github.action_path }}/run-terraform.sh" init terraform init -upgrade -input=false

    - name: Terraform Validate
      if: ${{ inputs.execution-mode != 'reviewed-apply' }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: bash "${{ github.action_path }}/run-terraform.sh" validate terraform validate -no-color

    - name: Terraform Plan
      id: plan
      if: ${{ inputs.execution-mode != 'reviewed-apply' }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        PLAN_ARGS: ${{ inputs.plan-args }}
      run: |
        rm -f tfplan.tfplan result.txt

        if [ -f "terraform.tfvars" ]; then
          echo "✅ terraform.tfvars found, using it."
          CMD=(terraform plan -input=false -no-color -var-file="terraform.tfvars")
        else
          echo "⚠️ No terraform.tfvars found, running plan without it."
          CMD=(terraform plan -input=false -no-color)
        fi

        if [ -n "$PLAN_ARGS" ]; then
          CMD+=($PLAN_ARGS)
        fi

        CMD+=(-out=tfplan.tfplan)

        bash "${{ github.action_path }}/run-terraform.sh" plan "${CMD[@]}"

    - name: Capture saved plan context
      id: plan_context
      if: ${{ inputs.plan-storage == 'azure-blob' && steps.plan.outcome == 'success' }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        EXPECTED_COMMIT: ${{ github.sha }}
      run: |
        actual_commit=$(git rev-parse HEAD 2>/dev/null) || exit 1
        [[ "$actual_commit" == "$EXPECTED_COMMIT" ]] || { echo 'Checkout does not match workflow commit.' >&2; exit 1; }
        root=$(git rev-parse --show-prefix 2>/dev/null) || exit 1
        root=${root%/}; root=${root:-.}
        [[ "$root" =~ ^[A-Za-z0-9_./-]{1,200}$ ]] || exit 1
        workspace=$(terraform workspace show 2>/dev/null) || exit 1
        version=$(terraform version -json 2>/dev/null | jq -er .terraform_version) || exit 1
        [[ "$workspace" =~ ^[A-Za-z0-9_.-]{1,100}$ && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
        checksum=$(sha256sum tfplan.tfplan | cut -d ' ' -f 1) || exit 1
        {
          echo "workspace=$workspace"
          echo "commit=$actual_commit"
          echo "root=$root"
          echo "version=$version"
          echo "checksum=$checksum"
        } >> "$GITHUB_OUTPUT"

    - name: Terraform plan summary
      id: summary
      if: ${{ always() && steps.plan.outcome != 'skipped' }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        PLAN_OUTCOME: ${{ steps.plan.outcome }}
        PLAN_SUMMARY_MODE: ${{ inputs.plan-summary-mode }}
      run: bash "${{ github.action_path }}/summarize-plan.sh"

    - name: Check secure plan review summary
      if: ${{ inputs.plan-storage == 'azure-blob' && steps.plan.outcome == 'success' }}
      shell: bash
      env:
        COUNTS_READY: ${{ steps.summary.outputs.counts-ready }}
        HUMAN_READY: ${{ steps.summary.outputs.human-ready }}
        SUMMARY_MODE: ${{ inputs.plan-summary-mode }}
      run: |
        [[ "$COUNTS_READY" == true ]] || { echo 'Plan counts are unavailable; secure publication stopped.' >&2; exit 1; }
        case "$SUMMARY_MODE" in
          counts-only) ;;
          human-readable) [[ "$HUMAN_READY" == true ]] || { echo 'Human-readable summary unavailable; secure publication stopped.' >&2; exit 1; } ;;
          *) echo 'Unsupported plan summary mode; secure publication stopped.' >&2; exit 1 ;;
        esac

    - name: Store reviewed plan
      id: store
      if: ${{ inputs.plan-storage == 'azure-blob' && steps.plan.outcome == 'success' }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        PLAN_STORAGE_ACCOUNT: ${{ inputs.plan-storage-account }}
        PLAN_CONTAINER: ${{ inputs.plan-storage-container }}
        EVENT_CONTAINER: ${{ inputs.plan-events-container }}
        PLAN_ENVIRONMENT: ${{ inputs.plan-environment }}
        PLAN_WORKSPACE: ${{ steps.plan_context.outputs.workspace }}
        PLAN_ROOT: ${{ steps.plan_context.outputs.root }}
        PLAN_TERRAFORM_VERSION: ${{ steps.plan_context.outputs.version }}
        PLAN_SHA256: ${{ steps.plan_context.outputs.checksum }}
        PLAN_COMMIT: ${{ github.sha }}
      run: python3 "${{ github.action_path }}/plan_store.py" publish

    - name: Terraform Apply (opt-in)
      id: apply_plan
      if: ${{ success() && inputs.execution-mode == 'legacy' && steps.plan.outcome == 'success' && inputs.apply == 'true' }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: bash "${{ github.action_path }}/run-terraform.sh" apply terraform apply -input=false -auto-approve tfplan.tfplan

    - name: Summarize Terraform apply
      if: ${{ always() && steps.apply_plan.outcome != 'skipped' }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        APPLY_OUTCOME: ${{ steps.apply_plan.outcome }}
        APPLY_EXIT_CODE: ${{ steps.apply_plan.outputs.exit-code }}
        APPLY_OUTPUT_READY: ${{ steps.apply_plan.outputs.output-ready }}
        APPLY_SUMMARY_MODE: ${{ inputs.apply-summary-mode }}
        APPLY_ENVIRONMENT: ${{ inputs.plan-environment }}
        APPLY_PLAN_ID: ${{ inputs.plan-id }}
      run: |
        export APPLY_COMMIT="$(git rev-parse HEAD 2>/dev/null || :)"
        python3 "${{ github.action_path }}/summarize-apply.py" 2>/dev/null || echo '::warning::Terraform apply summary unavailable.'

    - name: Authenticate for reviewed plan lookup
      if: ${{ inputs.execution-mode == 'reviewed-apply' }}
      shell: bash
      env:
        AZURE_CREDENTIALS: ${{ inputs.azure-credentials }}
        AZURE_SUBSCRIPTION: ${{ inputs.azure-subscription }}
      run: |
        client_id=$(jq -er .clientId <<< "$AZURE_CREDENTIALS" 2>/dev/null) || exit 1
        client_secret=$(jq -er .clientSecret <<< "$AZURE_CREDENTIALS" 2>/dev/null) || exit 1
        tenant_id=$(jq -er .tenantId <<< "$AZURE_CREDENTIALS" 2>/dev/null) || exit 1
        subscription_id=${AZURE_SUBSCRIPTION:-$(jq -er .subscriptionId <<< "$AZURE_CREDENTIALS" 2>/dev/null)}
        az login --service-principal -u "$client_id" -p "$client_secret" --tenant "$tenant_id" --output none >/dev/null 2>&1
        az account set --subscription "$subscription_id"

    - name: Resolve reviewed plan metadata
      id: reviewed_plan
      if: ${{ inputs.execution-mode == 'reviewed-apply' }}
      shell: bash
      env:
        PLAN_STORAGE_ACCOUNT: ${{ inputs.plan-storage-account }}
        PLAN_CONTAINER: ${{ inputs.plan-storage-container }}
        EVENT_CONTAINER: ${{ inputs.plan-events-container }}
        PLAN_ENVIRONMENT: ${{ inputs.plan-environment }}
        PLAN_ID: ${{ inputs.plan-id }}
      run: python3 "${{ github.action_path }}/plan_store.py" inspect

    - name: Checkout reviewed commit
      if: ${{ inputs.execution-mode == 'reviewed-apply' }}
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.reviewed_plan.outputs.commit }}
        token: ${{ inputs.github-token }}
        clean: false
        persist-credentials: false

    # A relative uses path resolves to the consumer checkout. Pin the existing
    # saved-apply action so it remains independent of the reviewed checkout.
    - name: Apply reviewed saved plan
      if: ${{ inputs.execution-mode == 'reviewed-apply' }}
      uses: aardex/AardexActions/terraform-apply-saved@53c4effaa17146b2beb1e1c44f19f6c7667c63ea
      with:
        azure-credentials: ${{ inputs.azure-credentials }}
        azure-subscription: ${{ inputs.azure-subscription }}
        github-token: ${{ inputs.github-token }}
        directory: ${{ inputs.directory }}
        plan-id: ${{ inputs.plan-id }}
        plan-sha256: ${{ steps.reviewed_plan.outputs.sha256 }}
        plan-commit: ${{ steps.reviewed_plan.outputs.commit }}
        plan-workspace: ${{ steps.reviewed_plan.outputs.workspace }}
        plan-environment: ${{ inputs.plan-environment }}
        plan-storage-account: ${{ inputs.plan-storage-account }}
        plan-storage-container: ${{ inputs.plan-storage-container }}
        plan-events-container: ${{ inputs.plan-events-container }}
        apply-summary-mode: ${{ inputs.apply-summary-mode }}
