name: OCI golden path CI
on:
  pull_request:
    paths: [.github/workflows/oci-*.yml, oci-golden-path/**, release-management/manifest.py, release-management/release-manifest.schema.json]
  push:
    branches: [main]
    paths: [.github/workflows/oci-*.yml, oci-golden-path/**, release-management/manifest.py, release-management/release-manifest.schema.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run workflow step and manifest compatibility tests
        run: |
          python3 -m pip install -r release-management/requirements-ci.txt
          python3 -m unittest discover -s oci-golden-path/tests -v
      - name: Validate reusable workflows and example with pinned actionlint
        env:
          ACTIONLINT_TEMP: ${{ runner.temp }}/oci-actionlint
        run: |
          mkdir -p "$ACTIONLINT_TEMP"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$ACTIONLINT_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$ACTIONLINT_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$ACTIONLINT_TEMP/actionlint.tar.gz" -C "$ACTIONLINT_TEMP" actionlint
          "$ACTIONLINT_TEMP/actionlint" .github/workflows/oci-*.yml oci-golden-path/examples/*.yml
