name: Terraform format validate tests
on:
  pull_request:
    paths: [terraform-format-validate/**, .github/workflows/terraform-format-validate.yml]
  push:
    branches: [main]
    paths: [terraform-format-validate/**, .github/workflows/terraform-format-validate.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - run: python3 -m unittest discover -s terraform-format-validate/tests -v
