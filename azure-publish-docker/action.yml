name: Azure Deploy Docker
description: Build & Deploy a Docker application to Azure Container Apps

inputs:
  image-name:
    required: true
    description: "Name of the Docker image"
  version:
    required: false
    description: "Version tag for the Docker image"
    default: 'latest'
  github-token:
    required: true
    description: "GitHub token for authentication"
  azure-credentials:
    required: false
    description: "Azure credentials for authentication"
  subscription-id:
    required: true
    description: "Azure Subscription ID"
  acr-login-server:
    required: true
    description: "Azure Container Server Name"
  docker-directory:
    required: false
    default: 'docker'
    description: "Path to the Dockerfile"
  dockerfile-name:
    required: false
    default: 'Dockerfile'
    description: "Name of the Dockerfile"
  platforms:
    required: false
    default: 'linux/amd64'
    description: "Comma-separated list of target platforms for multi-arch build"
  build-args:
    required: false
    default: ''
    description: "Docker build args (multi-line KEY=VALUE)"
  nuget-secret-mode:
    required: false
    default: 'false'
    description: "Mount github-token as the nuget_pat BuildKit secret instead of a build argument"

outputs:
  digest:
    description: "Published image manifest digest"
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Login to Azure
      shell: bash
      run: |
        CLIENT_ID=$(echo '${{ inputs.azure-credentials }}' | jq -r .clientId)
        CLIENT_SECRET=$(echo '${{ inputs.azure-credentials }}' | jq -r .clientSecret)
        TENANT_ID=$(echo '${{ inputs.azure-credentials }}' | jq -r .tenantId)
        az login --service-principal -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID"
        az account set --subscription ${{ inputs.subscription-id }}

    - name: Login to Azure Container Registry ${{ inputs.acr-login-server }}
      shell: bash
      run: |
        az acr login --name ${{ inputs.acr-login-server }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    - name: Reject NuGet token build arguments in secret mode
      if: ${{ inputs.nuget-secret-mode == 'true' }}
      shell: bash
      env:
        EXTRA_BUILD_ARGS: ${{ inputs.build-args }}
      run: |
        # Buildx parses CSV records, so a quoted value can span multiple lines.
        # Scan complete records without treating lines inside a value as new args.
        if ! printf '%s\n' "$EXTRA_BUILD_ARGS" | LC_ALL=C awk '
          function check_record() {
            if (record ~ "^" ws "*\"?" ws "*NUGET_PAT(" ws "*=|" ws "*\"?" ws "*$)") bad = 1
            record = ""
            field_start = 1
          }
          BEGIN { field_start = 1 }
          { input = input $0 "\n" }
          END {
            # The downstream parser trims the input and detects its first
            # unquoted record delimiter (LF, CRLF or CR).
            ws = "([[:space:]]|\302\240|\341\232\200|\342\200[\200-\212\250\251\257]|\342\201\237|\343\200\200|\357\273\277)"
            sub("^" ws "*", "", input)
            sub(ws "*$", "", input)
            for (i = 1; i <= length(input); i++) {
              c = substr(input, i, 1)
              next_c = substr(input, i + 1, 1)
              if (!quoted && delimiter == "" && (c == "\r" || c == "\n")) {
                delimiter = (c == "\r" && next_c == "\n") ? "\r\n" : c
              }
              if (!quoted && delimiter != "" && substr(input, i, length(delimiter)) == delimiter) {
                check_record()
                i += length(delimiter) - 1
                continue
              }
              record = record c
              if (quoted && c == "\"") {
                if (next_c == "\"") {
                  record = record "\""
                  i++
                } else quoted = 0
              } else if (!quoted && c == ",") field_start = 1
              else if (!quoted && field_start && c == "\"") { quoted = 1; field_start = 0 }
              else if (!quoted) field_start = 0
            }
            check_record()
            if (quoted || bad) exit 1
          }
        '; then
          echo 'Invalid build arguments or NUGET_PAT is not allowed in secret mode.' >&2
          exit 1
        fi

    - name: Build and push Docker image ${{ inputs.image-name }}:${{ inputs.version }}
      id: build
      uses: docker/build-push-action@v5
      env:
        NUGET_PAT_SECRET: ${{ inputs.github-token }}
      with:
        context: .
        file: ${{ inputs.docker-directory }}/${{ inputs.dockerfile-name }}
        push: true
        platforms: ${{ inputs.platforms }}
        builder: ${{ steps.buildx.outputs.name }}
        tags: |
          ${{ inputs.acr-login-server }}/${{ inputs.image-name }}:${{ inputs.version != '' && inputs.version || 'latest' }}
          ${{ inputs.acr-login-server }}/${{ inputs.image-name }}:latest
        cache-from: type=registry,ref=${{ inputs.acr-login-server }}/${{ inputs.image-name }}:buildcache
        cache-to: type=registry,ref=${{ inputs.acr-login-server }}/${{ inputs.image-name }}:buildcache,mode=max
        build-args: |
          ${{ inputs.nuget-secret-mode != 'true' && format('NUGET_PAT={0}', inputs.github-token) || '' }}
          ${{ inputs.build-args }}
        secret-envs: ${{ inputs.nuget-secret-mode == 'true' && 'nuget_pat=NUGET_PAT_SECRET' || '' }}
        provenance: false
