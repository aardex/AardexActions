name: terraform-forat-validate
description: Format and validate Terraform module for a given directory

inputs:
  azure-credentials:
    required: false
    description: "Optional Azure credentials in JSON format"
  directory:
    description: Directory to format and validate
    required: true
    default: '.'
  fix:
    description: Automatically fix Terraform formatting issues
    required: false
    default: 'true'
  auto-commit:
    description: Automatically commit and push formatting fixes (true, false, or auto to follow fix)
    required: false
    default: 'auto'
  auto-commit-message:
    description: Commit message used when auto-commit is enabled
    required: false
    default: 'chore(terraform): auto-format files [skip ci]'
  github-token:
    required: false
    description: "Optional GitHub token for private modules and authenticated pushes"
  init-backend:
    required: false
    default: 'true'
    description: "Initialize the configured backend; set false for offline backend validation"

runs:
  using: composite
  steps:
    - name: Extract Azure credentials
      if: ${{ inputs.azure-credentials != '' }}
      shell: bash
      env:
        AZURE_CREDENTIALS: ${{ inputs.azure-credentials }}
      run: |
        set -euo pipefail
        for pair in ARM_CLIENT_ID:clientId ARM_CLIENT_SECRET:clientSecret ARM_SUBSCRIPTION_ID:subscriptionId ARM_TENANT_ID:tenantId; do
          name=${pair%%:*}
          key=${pair#*:}
          value=$(jq -er --arg key "$key" '.[$key] | select(type == "string" and length > 0)' <<< "$AZURE_CREDENTIALS")
          echo "::add-mask::$value"
          printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
        done

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.13.3

    - name: Format Terraform files
      id: format
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        if [ "${{ inputs.fix }}" = "true" ]; then
          terraform fmt -recursive
        else
          terraform fmt -check -recursive
        fi
        
    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        GH_MODULE_TOKEN: ${{ inputs.github-token }}
        INIT_BACKEND: ${{ inputs.init-backend }}
      run: bash "$GITHUB_ACTION_PATH/init.sh"

    - name: Validate Terraform files
      id: validate
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        terraform validate -no-color
        if [ $? -ne 0 ]; then
          echo "Terraform files are not valid."
          exit 1
        fi

    - name: Commit and push formatting fixes
      if: ${{ (inputs.auto-commit == 'true') || (inputs.auto-commit == 'auto' && inputs.fix == 'true') }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        GH_MODULE_TOKEN: ${{ inputs.github-token }}
        COMMIT_MESSAGE: ${{ inputs.auto-commit-message }}
      run: |
        set -euo pipefail
        if git diff --quiet && git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add -A
        if git diff --cached --quiet; then
          echo "No staged changes to commit."
          exit 0
        fi

        git commit -m "$COMMIT_MESSAGE"

        BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}}"
        if [ "$BRANCH" = "HEAD" ] || [ -z "$BRANCH" ]; then
          echo "Could not determine a valid branch name for push."
          exit 1
        fi

        bash "$GITHUB_ACTION_PATH/push.sh" "$BRANCH"
