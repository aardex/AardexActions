name: Deploy Docker to Container App
description: Build & Deploy a Docker application to Azure Container Apps

inputs:
  environment:
    required: true
    description: "Target environment for deployment"
  azure-environment:
    required: true
    description: "Azure environment to use"
  ca-name:
    required: true
    description: "Name of the Azure Container App"
  image-name:
    required: true
    description: "Name of the Docker image"
  version:
    required: false
    description: "Version tag for the Docker image"
  version-file-path:
    required: false
    default: ''
    description: "Optional path to Directory.Build.props for version extraction"
  config-file-path:
    required: false
    default: ''
    description: "Path to configuration file. Only required for .Net projects."
  github-token:
    required: true
    description: "GitHub token for authentication"
  azure-credentials:
    required: true
    description: "Azure credentials for authentication"
  subscription-id:
    required: true
    description: "Azure Subscription ID"
  acr-login-server:
    required: true
    description: "Azure Container Server Name"
  ca-resource-group:
    required: true
    description: "Resource group for Azure Container App"
  docker-directory:
    required: false
    default: 'docker'
    description: "Path to the Dockerfile"
  dockerfile-name:
    required: false
    default: 'Dockerfile'
    description: "Name of the Dockerfile"
  platforms:
    required: false
    default: 'linux/amd64'
    description: "Comma-separated list of target platforms for multi-arch build"
  build-args:
    required: false
    default: ''
    description: "Docker build args (multi-line KEY=VALUE)"
  skip-check:
    required: false
    default: 'false'
    description: "Skip vulnerability check"
  nuget-secret-mode:
    required: false
    default: 'false'
    description: "Use a BuildKit secret for the NuGet token"
  deploy-by-digest:
    required: false
    default: 'false'
    description: "Scan and deploy the exact image digest returned by the build"

runs:
  using: composite
  steps:
    - name: Build and push Docker image
      id: publish
      uses: aardex/AardexActions/azure-publish-dotnet-docker@main
      with:
        environment: ${{ inputs.environment }}
        image-name: ${{ inputs.image-name }}
        version: ${{ inputs.version }}
        version-file-path: ${{ inputs.version-file-path }}
        config-file-path: ${{ inputs.config-file-path }}
        github-token: ${{ inputs.github-token }}
        subscription-id: ${{ inputs.subscription-id }}
        azure-credentials: ${{ inputs.azure-credentials }}
        acr-login-server: ${{ inputs.acr-login-server }}
        docker-directory: ${{ inputs.docker-directory }}
        dockerfile-name: ${{ inputs.dockerfile-name }}
        platforms: ${{ inputs.platforms }}
        build-args: ${{ inputs.build-args }}
        nuget-secret-mode: ${{ inputs.nuget-secret-mode }}

    - name: Resolve image reference
      id: image
      shell: bash
      env:
        REGISTRY: ${{ inputs.acr-login-server }}
        IMAGE: ${{ inputs.image-name }}
        VERSION: ${{ steps.publish.outputs.version }}
        DIGEST: ${{ steps.publish.outputs.digest }}
        BY_DIGEST: ${{ inputs.deploy-by-digest }}
      run: |
        if [[ "$BY_DIGEST" == 'true' ]]; then
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Build did not return a valid image digest.' >&2; exit 1; }
          echo "reference=$REGISTRY/$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
        else
          echo "reference=$REGISTRY/$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
        fi

    - name: Scan Docker image for vulnerabilities
      if: ${{ inputs.skip-check != 'true' }}
      uses: aquasecurity/trivy-action@0.35.0
      with:
        image-ref: ${{ steps.image.outputs.reference }}
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

    - name: Update Azure Container Apps ${{ inputs.image-name }}:${{ steps.publish.outputs.version }}
      shell: bash
      env:
        IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
      run: |
        az config set extension.use_dynamic_install=yes_without_prompt
        az containerapp update \
          --name ${{ inputs.ca-name }}-${{ inputs.azure-environment }} \
          --resource-group ${{ inputs.ca-resource-group }} \
          --image "$IMAGE_REFERENCE"
